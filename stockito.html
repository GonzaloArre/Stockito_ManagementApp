({v:ventas,k:corte,t:ventasT,p:prods,b:codigos,h:histT,e:equipo})[tab]()}

HERO='<div class="hero" style="grid-column:1/-1"><h2>👋 ¡Empecemos!</h2><div>Todavía no hay productos cargados. Así de simple se usa STOCKITO:</div><div class="steps"><div class="step"><b>1</b>Cargá tus productos en <u>Productos</u> (con o sin código de barras)</div><div class="step"><b>2</b>Escaneá el código o tocá el producto para sumarlo al ticket</div><div class="step"><b>3</b>Apretá <u>Cobrar</u> y elegí cómo pagó el cliente</div></div><button data-tab="p" style="margin-top:16px;background:#fff;color:#5b21b6;font-weight:700">📦 Cargar mi primer producto</button></div>';
function errPop(t,m){const e=$('#alertbox');e.innerHTML=`<b style="color:var(--bad);font-size:16px">⛔ ${esc(t)}</b><div style="margin:8px 0 10px">${esc(m)}</div><button data-act="aok" style="width:100%">Entendido</button>`;e.classList.add('on');clearTimeout(at);at=setTimeout(()=>e.classList.remove('on'),15000)}
function printTk(s){$('#tkt').innerHTML=`<div style="text-align:center">${S.biz?`<b style="font-size:14px">${esc(S.biz.name)}</b><br>${esc(S.biz.addr)}${S.biz.cuit?'<br>CUIT: '+esc(S.biz.cuit):''}<br>${esc(S.biz.iva)}`:'<b>TICKET DE VENTA</b>'}<br>${dt(s.t)}<br>Operación Nº ${S.sales.indexOf(s)+1}${s.emp?'<br>Atendió: '+esc(s.emp):''}</div><hr>${s.items.map(i=>`<div>${i.qty} x ${esc(i.name)}<div style="text-align:right">${fmt(i.price*i.qty)}</div></div>`).join('')}<hr><div style="font-size:15px"><b>TOTAL ${fmt(s.total)}</b></div><div>Pago: ${s.m}${s.who?' ('+esc(s.who)+')':''}</div><hr><div style="text-align:center;font-size:11px"><b>COMPROBANTE NO FISCAL</b><br>DOCUMENTO NO VÁLIDO COMO FACTURA</div><div style="text-align:center;margin-top:8px">¡Gracias por su compra!</div>`;try{window.print()}catch(e){toast('No se pudo abrir la impresión')}}
function ventas(){$('#main').innerHTML='<div class="v"><div><div class="row" style="margin:0"><input id="q" placeholder="Escaneá el código o escribí la descripción… (F2)" autocomplete="off"><button class="pri" data-act="qm">+ Sin código (F3)</button><button data-act="mv">💸 Egresos / movimientos</button></div><div class="chips" id="chips"></div><div id="grid"></div><div class="keys"><span><kbd>F2</kbd> Buscar</span><span><kbd>F3</kbd> Producto sin código</span><span><kbd>F12</kbd> Cobrar</span><span>📷 Escaneá un código y se suma solo al ticket</span></div></div><div class="pnl"><h2>Ticket actual</h2><div id="tk"></div></div></div>';$('#q').value=q;$('#q').focus();grid();ticket()}
function add(id,d=1){const p=P(id),l=cart.find(l=>l.id==id);if(d>0){if(p.stock<=0)return toast('Sin stock: '+p.name);if((l?l.qty:0)+d>p.stock)return toast('Solo quedan '+p.stock+' de '+p.name)}if(l){l.qty+=d;if(l.qty<=0)cart=cart.filter(x=>x!==l)}else if(d>0)cart.push({id,qty:1});ticket()}
function grid(){$('#chips').innerHTML=depts().map(d=>`<button class="${d==dept?'on':''}" data-act="dept" data-v="${esc(d)}">${esc(d)}</button>`).join('');
const s=q.toLowerCase(),L=S.prods.filter(p=>(dept=='Todos'||p.dept==dept)&&(!s||p.name.toLowerCase().includes(s)||p.code.includes(s)));
$('#grid').innerHTML=L.length?L.map(p=>`<button class="p${p.stock<=LOWSTK?' lw':''}" ${p.stock>LOWSTK?`style="border-left:6px solid hsl(${hue(p.dept)} 65% 55%)"`:''} data-act="add" data-id="${p.id}" ${p.stock<=0?'disabled':''}>${esc(p.name)}<strong>${fmt(p.price)}</strong><span class="${p.stock<=LOWSTK?'low':''}">${p.stock<=0?'Sin stock':p.stock+' en stock'}</span></button>`).join(''):`${S.prods.length?'<div class="empty" style="grid-column:1/-1">No hay productos con esa búsqueda.</div>':HERO}`}
function ticket(){const e=$('#tk');if(!e)return;e.innerHTML=(cart.length?cart.map(l=>{const p=l.free?l:P(l.id),bt=l.free?`data-act="fq" data-k="${l.id}"`:`data-act="add" data-id="${p.id}"`;return`<div class="ln"><div>${esc(p.name)}<br><kbd>${fmt(p.price)} c/u${l.free?' · sin código':''}</kbd></div><div class="qty"><button ${bt} data-d="-1">−</button>${l.qty}<button ${bt} data-d="1">+</button></div><b>${fmt(p.price*l.qty)}</b></div>`}).join(''):'<div class="empty"><div style="font-size:36px">🛒</div>Todavía no hay nada en el ticket.<br>Tocá un producto o escaneá su código.</div>')+`<div class="tot">${fmt(total())}</div><button class="pri" style="width:100%;padding:14px;font-size:17px" data-act="pay" ${cart.length?'':'disabled'}>Cobrar <kbd style="color:inherit">F12</kbd></button><button style="width:100%;margin-top:8px" data-act="clear" ${cart.length?'':'disabled'}>Vaciar ticket</button>`}
function payM(){const t=total(),g=+pay.g||0,names=[...new Set(S.sales.filter(s=>s.m=='Fiado').map(s=>s.who))];
let x=`<h2>Total a cobrar</h2><div class="tot" style="margin:0">${fmt(t)}</div><div class="ms">${['Efectivo','Transferencia','Fiado'].map(k=>`<button class="${pay.m==k?'on':''}" data-act="pm" data-v="${k}">${{Efectivo:'💵',Transferencia:'🏦',Fiado:'📝'}[k]}<br>${k}</button>`).join('')}</div>`;
if(pay.m=='Efectivo')x+=`<input id="pg" type="number" inputmode="numeric" placeholder="Paga con…" value="${pay.g}" style="font-size:18px"><div class="row" style="margin:0">${[t,Math.ceil(t/1000)*1000,Math.ceil(t/5000)*5000,Math.ceil(t/10000)*10000].filter((v,i,a)=>a.indexOf(v)==i).map(v=>`<button data-act="pg" data-v="${v}">${fmt(v)}</button>`).join('')}</div><div id="vu" style="font-size:20px">${g>=t?'Vuelto: <b>'+fmt(g-t)+'</b>':g?'<span class="low">Faltan '+fmt(t-g)+'</span>':''}</div>`;
if(pay.m=='Transferencia')x+='<div>Confirmá cuando veas la transferencia acreditada.</div>';
if(pay.m=='Fiado')x+=`<label>¿A quién se le fía?<input id="fw" list="fn" value="${esc(pay.w)}" placeholder="Nombre de la persona"></label><datalist id="fn">${names.map(n=>`<option value="${esc(n)}">`).join('')}</datalist>`;
x+=`<div class="row" style="margin:0"><button data-act="cancel">Cancelar <kbd>Esc</kbd></button><button class="pri" data-act="ok" style="flex:2">Confirmar venta <kbd style="color:inherit">Enter</kbd></button></div>`;dlg(x,done);if(pay.m=='Efectivo'&&$('#pg')&&!pay.f){$('#pg').focus();pay.f=1}}
function done(){if(!pay)return;const t=total(),m0=chk();if(m0)return toast(m0);
